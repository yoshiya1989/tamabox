<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq, type = 'sine', duration = 0.08) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}

// ===== 沖縄ステージ背景モジュール =====
// 0:首里城風 / 1:国際通り風 / 2:美ら海水族館風 / 3:残波岬風
const STAGE_NAMES = ['🏯 首里城', '🌃 国際通り', '🐋 美ら海水族館', '🌅 残波岬', '🌉 古宇利大橋'];
const LEVELS_PER_STAGE = 3;

let bgStage = 0, bgPrevStage = 0, bgFade = 1;

function stageOf(level) {
    return Math.min(4, Math.floor((level - 1) / LEVELS_PER_STAGE));
}

function drawBackground(ctx, w, h, level, t) {
    const s = stageOf(level);
    if (s !== bgStage) { bgPrevStage = bgStage; bgStage = s; bgFade = 0; }
    if (bgFade < 1) {
        bgFade = Math.min(1, bgFade + 0.02);
        drawStage(ctx, w, h, bgPrevStage, t);
        ctx.globalAlpha = bgFade;
        drawStage(ctx, w, h, bgStage, t);
        ctx.globalAlpha = 1;
    } else {
        drawStage(ctx, w, h, bgStage, t);
    }
    // ゲーム要素を見やすくする薄い暗幕
    ctx.fillStyle = 'rgba(15,10,30,0.28)';
    ctx.fillRect(0, 0, w, h);
}

function grad(ctx, w, h, stops) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    stops.forEach(([p, c]) => g.addColorStop(p, c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
}

function cloud(ctx, x, y, r, a) {
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    [[0, 0, 1], [r * 0.9, r * 0.2, 0.8], [-r * 0.9, r * 0.2, 0.7]].forEach(([dx, dy, k]) => {
        ctx.beginPath(); ctx.arc(x + dx, y + dy, r * k, 0, 7); ctx.fill();
    });
}

function drawStage(ctx, w, h, s, t) {
    ctx.save();
    if (s === 0) shuri(ctx, w, h, t);
    else if (s === 1) kokusai(ctx, w, h, t);
    else if (s === 2) churaumi(ctx, w, h, t);
    else if (s === 3) zanpa(ctx, w, h, t);
    else koori(ctx, w, h, t);
    ctx.restore();
}

// --- 首里城風:朝焼けの空と朱色の正殿 ---
function shuri(ctx, w, h, t) {
    grad(ctx, w, h, [[0, '#ff9ecb'], [0.5, '#ffcba4'], [1, '#ffe9a8']]);
    for (let i = 0; i < 4; i++) cloud(ctx, ((t * 0.15 + i * w / 3) % (w + 200)) - 100, h * (0.1 + i * 0.07), 22 + i * 4, 0.7);
    // 丘
    ctx.fillStyle = '#7bc47f';
    ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(0, h * 0.75);
    ctx.quadraticCurveTo(w * 0.5, h * 0.55, w, h * 0.75); ctx.lineTo(w, h); ctx.fill();
    // 石垣
    ctx.fillStyle = '#d9d2c3';
    ctx.fillRect(w * 0.12, h * 0.7, w * 0.76, h * 0.06);
    ctx.strokeStyle = '#b8b09f'; ctx.lineWidth = 1;
    for (let x = w * 0.12; x < w * 0.88; x += 24) { ctx.beginPath(); ctx.moveTo(x, h * 0.7); ctx.lineTo(x, h * 0.76); ctx.stroke(); }
    // 正殿(二層)
    const cx = w / 2, by = h * 0.7;
    ctx.fillStyle = '#e8383d'; ctx.fillRect(cx - 70, by - 38, 140, 38);
    ctx.fillStyle = '#c0282e'; ctx.fillRect(cx - 52, by - 70, 104, 32);
    ctx.fillStyle = '#b5322f';
    ctx.beginPath(); ctx.moveTo(cx - 90, by - 38); ctx.lineTo(cx + 90, by - 38); ctx.lineTo(cx + 60, by - 52); ctx.lineTo(cx - 60, by - 52); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - 68, by - 70); ctx.lineTo(cx + 68, by - 70); ctx.lineTo(cx + 40, by - 90); ctx.lineTo(cx - 40, by - 90); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.fillRect(cx - 12, by - 28, 24, 28);
    for (let i = -2; i <= 2; i++) ctx.fillRect(cx + i * 24 - 3, by - 62, 6, 14);
    // 龍の飾り
    ctx.fillRect(cx - 4, by - 98, 8, 8);
}

// --- 国際通り風:夕暮れのネオン街 ---
function kokusai(ctx, w, h, t) {
    grad(ctx, w, h, [[0, '#2b1055'], [0.55, '#7b3fa0'], [1, '#ff8fb1']]);
    const cols = ['#ff6b81', '#ffd166', '#70a1ff', '#7bed9f', '#ff9ff3'];
    const bw = Math.max(46, w / 7);
    for (let i = 0; i * bw < w + bw; i++) {
        const bh = h * (0.28 + ((i * 37) % 17) / 70);
        const x = i * bw, y = h * 0.82 - bh;
        ctx.fillStyle = i % 2 ? '#3a2a5e' : '#4a3472';
        ctx.fillRect(x, y, bw - 4, bh);
        // 窓
        for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) {
            const on = ((i * 7 + r * 3 + c + Math.floor(t / 90)) % 4) !== 0;
            ctx.fillStyle = on ? '#ffeaa7' : '#2d2150';
            ctx.fillRect(x + 6 + c * (bw / 3.4), y + 10 + r * 20, 9, 11);
        }
        // ネオン看板
        const c = cols[i % cols.length];
        ctx.shadowColor = c; ctx.shadowBlur = 12 + 4 * Math.sin(t / 20 + i);
        ctx.fillStyle = c; ctx.fillRect(x + 6, y + bh * 0.62, bw - 16, 8);
        ctx.shadowBlur = 0;
    }
    // 道路
    ctx.fillStyle = '#2a2140'; ctx.fillRect(0, h * 0.82, w, h * 0.18);
    // 提灯(ちょうちん)
    for (let x = 20; x < w; x += 56) {
        const sway = Math.sin(t / 40 + x) * 3;
        ctx.strokeStyle = '#ffd166'; ctx.beginPath(); ctx.moveTo(x, h * 0.78); ctx.lineTo(x + sway, h * 0.82); ctx.stroke();
        ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.ellipse(x + sway, h * 0.835, 5, 7, 0, 0, 7); ctx.fill();
    }
}

// --- 美ら海水族館風:大水槽とジンベエザメ ---
function churaumi(ctx, w, h, t) {
    grad(ctx, w, h, [[0, '#2fd0e8'], [0.5, '#1479c2'], [1, '#07224f']]);
    // 光のカーテン
    for (let i = 0; i < 5; i++) {
        const x = w * (0.1 + i * 0.2) + Math.sin(t / 80 + i) * 20;
        const g = ctx.createLinearGradient(x, 0, x + 60, h * 0.8);
        g.addColorStop(0, 'rgba(255,255,255,0.22)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 40, 0); ctx.lineTo(x + 110, h * 0.8); ctx.lineTo(x - 30, h * 0.8); ctx.fill();
    }
    // ジンベエザメ
    const sx = ((t * 0.5) % (w + 400)) - 200, sy = h * 0.5 + Math.sin(t / 60) * 14;
    ctx.fillStyle = '#4b6584';
    ctx.beginPath(); ctx.ellipse(sx, sy, 90, 26, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 80, sy); ctx.lineTo(sx - 125, sy - 28 + Math.sin(t / 10) * 6); ctx.lineTo(sx - 120, sy + 26); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 5, sy - 22); ctx.lineTo(sx + 12, sy - 46); ctx.lineTo(sx + 22, sy - 20); ctx.fill();
    ctx.fillStyle = '#dff9fb';
    for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(sx - 55 + i * 14, sy - 10 + (i % 3) * 9, 2.6, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(sx + 62, sy - 6, 3, 0, 7); ctx.fill();
    // 小魚の群れ
    for (let i = 0; i < 14; i++) {
        const fx = ((t * (0.8 + (i % 3) * 0.3) + i * 90) % (w + 60)) - 30;
        const fy = h * (0.2 + (i % 7) * 0.09) + Math.sin(t / 30 + i) * 8;
        ctx.fillStyle = i % 2 ? '#ffd166' : '#ff9ff3';
        ctx.beginPath(); ctx.ellipse(fx, fy, 7, 3.5, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(fx - 6, fy); ctx.lineTo(fx - 12, fy - 4); ctx.lineTo(fx - 12, fy + 4); ctx.fill();
    }
    // 泡
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 12; i++) {
        const bx = (i * 83) % w, by = h - ((t * (0.6 + i % 3 * 0.3) + i * 60) % h);
        ctx.beginPath(); ctx.arc(bx + Math.sin(t / 25 + i) * 6, by, 3 + i % 3, 0, 7); ctx.stroke();
    }
    // 砂地
    ctx.fillStyle = '#e8d9a8'; ctx.fillRect(0, h * 0.94, w, h * 0.06);
}

// --- 残波岬風:夕日・断崖・白い灯台 ---
function zanpa(ctx, w, h, t) {
    grad(ctx, w, h, [[0, '#4a2c82'], [0.35, '#ff6b81'], [0.6, '#ffb36b'], [0.6, '#1e6fa8'], [1, '#0a3b66']]);
    // 夕日と反射
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(w * 0.68, h * 0.55, 34, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,230,150,0.35)';
    for (let i = 0; i < 6; i++) ctx.fillRect(w * 0.68 - 30 + Math.sin(t / 20 + i) * 6, h * 0.62 + i * 14, 60 - i * 7, 4);
    cloud(ctx, ((t * 0.1) % (w + 200)) - 100, h * 0.15, 26, 0.5);
    // 波
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
    for (let r = 0; r < 5; r++) {
        ctx.beginPath();
        for (let x = 0; x <= w; x += 10) {
            const y = h * (0.68 + r * 0.06) + Math.sin(x / 30 + t / 25 + r) * 3;
            x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
    }
    // 断崖
    ctx.fillStyle = '#3b2f3a';
    ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(0, h * 0.62);
    ctx.lineTo(w * 0.22, h * 0.6); ctx.lineTo(w * 0.34, h * 0.7); ctx.lineTo(w * 0.3, h); ctx.fill();
    ctx.fillStyle = '#5ea05a'; ctx.fillRect(0, h * 0.6, w * 0.22, 6);
    // 灯台
    const lx = w * 0.1, ly = h * 0.6;
    ctx.fillStyle = '#fff'; ctx.beginPath();
    ctx.moveTo(lx - 10, ly); ctx.lineTo(lx - 6, ly - 70); ctx.lineTo(lx + 6, ly - 70); ctx.lineTo(lx + 10, ly); ctx.fill();
    ctx.fillStyle = '#ff4757'; ctx.fillRect(lx - 8, ly - 45, 16, 7);
    ctx.fillStyle = '#ffd166'; ctx.fillRect(lx - 6, ly - 82, 12, 12);
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(lx - 9, ly - 82); ctx.lineTo(lx, ly - 94); ctx.lineTo(lx + 9, ly - 82); ctx.fill();
    // 灯台の光
    ctx.fillStyle = `rgba(255,240,150,${0.15 + 0.1 * Math.sin(t / 15)})`;
    ctx.beginPath(); ctx.moveTo(lx, ly - 76); ctx.lineTo(lx + w * 0.5, ly - 110); ctx.lineTo(lx + w * 0.5, ly - 40); ctx.fill();
}

function nextQuiz(){
 if(!queue.length)queue=shuffle(QUIZ.map((_,i)=>i).filter(i=>!mastered.has(i)));
 if(!queue.length){mastered.clear();updK();queue=shuffle(QUIZ.map((_,i)=>i));banner('🎓 全問クリア!マスター2周目へ');}
 return queue.shift();
}
function showQuiz(title){
 const i=nextQuiz(),Q=QUIZ[i];paused=true;
 const opts=shuffle(Q.o.map((t,k)=>({t,ok:k===0})));
 $('qTitle').textContent=title;$('qText').textContent=Q.q;
 const box=$('qOpts');box.innerHTML='';$('qExp').style.display='none';$('qNext').style.display='none';
 opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;
  b.onclick=()=>{[...box.children].forEach(x=>x.disabled=true);
   if(o.ok){b.classList.add('ok');mastered.add(i);const g=60+castleHeightLevel*10;coins+=g;castleCodeStored+=3;playBeep(1200,'triangle',.2);$('qExp').textContent='⭕ 正解! +'+g+'🪙 +3📦　'+Q.e;updK();}

function waveTick(){
 const w=wave;w.t++;
 if(finalState===1){w.phase='fight';w.theme='healer';w.mul=1.3;w.t=0;$('waveText').textContent='👑FINAL';return;}
 if(w.phase==='fight'&&w.t>1500){w.phase='calm';w.t=0;banner('☕ ひと息タイム!今のうちに強化しよう');}
 else if(w.phase==='calm'&&w.t>420){
  w.phase='fight';w.t=0;w.n++;
  const ks=Object.keys(THEMES).filter(k=>k!==w.theme);w.theme=ks[Math.floor(Math.random()*ks.length)];w.mul=.7+Math.random()*.8;
  banner('🌊 Wave '+w.n+': '+THEMES[w.theme][0]);if(THEMES[w.theme][1])toast(THEMES[w.theme][1],6000);
  if(w.n%(stageOf(castleHeightLevel)>=4?3:5)===0)spawnBoss();
 }
 $('waveText').textContent='W'+w.n+(w.phase==='calm'?'☕':'');
}
function wallEffect(v){
 const P=world.pads;let m=1;
 [[P.firewall.level,.54,.05,.5,.35],[P.osUpdate.level-1,.75,.06,.6,0]].forEach(([lv,fy,sl,base,dm],i)=>{
  if(lv<=0||Math.abs(v.y-screenHeight*fy)>9)return;
  m*=Math.max(.1,base-lv*sl);if(dm)v.hp-=lv*dm;if(i)v.weak=true;
 });
 return m;
}
function drawWalls(){
 const P=world.pads;
 [[P.firewall.level,.54,'255,127,80','🔥ファイアウォール'],[P.osUpdate.level-1,.75,'232,67,147','🔄OSパッチ壁']].forEach(([lv,fy,c,name])=>{
  if(lv<=0)return;
  const y=screenHeight*fy,g=.25+.1*Math.sin(gameTime/15);
  ctx.fillStyle='rgba('+c+','+g+')';ctx.fillRect(0,y-8,screenWidth,16);
  ctx.strokeStyle='rgba('+c+',.9)';ctx.lineWidth=2;ctx.strokeRect(-2,y-8,screenWidth+4,16);
  ctx.lineWidth=1;for(let x=(gameTime*.3%22)-22;x<screenWidth;x+=22){ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);ctx.stroke();}
  ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='left';ctx.fillText(name+' Lv.'+lv,6,y-11);
 });
}

['ステージ3 クリア!(美ら海編)','マルウェアとランサムウェア',`<p>第3回は<b>マルウェア</b>(悪意のあるソフトウェアの総称)です。ウイルス、ワーム、ランサムウェアなどがあります。</p><p><b>ランサムウェア</b>は、データを暗号化して使えなくし、元に戻す代わりに金銭を要求します。主な侵入経路は、メールの添付ファイル、不正なWebサイト、そしてソフトウェアの<b>脆弱性</b>の悪用です。</p><ul><li>OSやソフトウェアを常に最新の状態にする</li><li>ウイルス対策ソフトを導入し、最新の状態に保つ</li><li>定期的に<b>バックアップ</b>を取る(3つのコピー・2種類の媒体・1つは別の場所、という「3-2-1ルール」が目安)</li><li>怪しい添付ファイルやリンクは開かない</li></ul><div class="pt">📝 ポイント:感染を完全に防ぐのは難しいため、「やられても復旧できる」備えが重要です。</div>`],
['ステージ4 クリア!(残波岬編)','多層防御と脆弱性対策',`<p>第4回は<b>多層防御</b>です。1つの対策が破られても次の対策で守れるように、防御を何層にも重ねる考え方です。ゲームの壁やワクチンを重ねてきたのと同じですね。</p><ul><li><b>入口</b>:ファイアウォールなどで不要な通信を遮断する</li><li><b>内部</b>:パッチ適用で脆弱性を修正、ウイルス対策、アクセス権を必要最小限に</li><li><b>人</b>:教育と訓練で、だまされにくくする</li><li><b>検知と対応</b>:ログを監視し、異常時の連絡手順を決めておく</li></ul><p>脆弱性の公表や修正パッチの提供前に行われる<b>ゼロデイ攻撃</b>のように、完全には防げない攻撃もあります。だからこそ「見つける・広げない・復旧する」準備が大切です。</p><div class="pt">📝 ポイント:セキュリティに100%はありません。被害を小さくする設計と、事故のときの手順を用意しましょう。</div>`],
['最終ステージへ!','インシデント対応と相談先',`<p>最終回は<b>インシデント対応</b>です。どれだけ備えても、事故(インシデント)がゼロになるとは限りません。起きたときに被害を小さくする手順が大切です。</p><ul><li><b>検知</b>:いつもと違う動きに気づく</li><li><b>初動</b>:ネットワークから切り離すなど、被害の拡大を防ぐ</li><li><b>報告・相談</b>:自分で抱え込まず、会社や学校の担当者へ</li><li><b>復旧と再発防止</b>:バックアップから戻し、原因をふさぐ</li></ul><p>相談先は、警察相談専用電話 <b>#9110</b>(緊急は110)、消費者ホットライン <b>188</b>、IPAの情報セキュリティ安心相談窓口などです。</p><p>いよいよ最終決戦。まだ対策が存在しない弱点を突く<b>ゼロデイ大魔王</b>が現れます。これまでの壁・ワクチン・AI・教育のすべてを活かしましょう!</p><div class="pt">📝 ポイント:異変に気づいたら、慌てて操作を重ねず、早めに相談しましょう。</div>`]];

function koori(ctx,w,h,t){
 grad(ctx,w,h,[[0,'#59c8ff'],[.5,'#bff0ff'],[.58,'#00c2c7'],[1,'#006e8c']]);
 for(let i=0;i<3;i++)cloud(ctx,((t*.12+i*w/2)%(w+200))-100,h*(.1+i*.08),24,.8);
 ctx.fillStyle='#5cbf6a';ctx.beginPath();ctx.moveTo(w*.62,h*.58);ctx.quadraticCurveTo(w*.8,h*.4,w,h*.5);ctx.lineTo(w,h*.58);ctx.fill();
 const by=h*.6,dy=x=>by+18-32*Math.sin(Math.min(1,x/(w*.75))*Math.PI*.9);
 ctx.fillStyle='#f4f4f4';for(let i=0;i<=7;i++){const x=w*.75*i/7;ctx.fillRect(x-3,dy(x),6,h*.72-dy(x));}
 ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();for(let x=0;x<=w*.75;x+=8){x?ctx.lineTo(x,dy(x)):ctx.moveTo(x,dy(x));}ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
 for(let r=0;r<5;r++){ctx.beginPath();for(let x=0;x<=w;x+=10){const y=h*(.72+r*.05)+Math.sin(x/28+t/22+r)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
}

function face(x,y,s,ph){
 const bl=((gameTime+(ph*40|0))%190)<6,ex=s*.34,ey=y-s*.1;
 ctx.strokeStyle='#3a2a4e';ctx.lineWidth=1.6;
 [-1,1].forEach(d=>{
  ctx.fillStyle='#3a2a4e';
  if(bl){ctx.beginPath();ctx.moveTo(x+d*ex-3,ey);ctx.lineTo(x+d*ex+3,ey);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(x+d*ex,ey,s*.17,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+d*ex-1,ey-1.5,s*.06,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,120,150,.55)';ctx.beginPath();ctx.ellipse(x+d*s*.6,y+s*.18,s*.16,s*.1,0,0,7);ctx.fill();
 });
 ctx.beginPath();ctx.arc(x,y+s*.12,s*.14,.1*Math.PI,.9*Math.PI);ctx.stroke();
}
function blob(x,y,s,col,ph){const w=Math.sin(gameTime/10+ph)*.07;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,s*(1+w),s*(.92-w),0,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(x-s*.3,y-s*.4,s*.35,s*.2,-.5,0,7);ctx.fill();}
function ear(x,y,r,col,rot){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,r*.6,r,rot,0,7);ctx.fill();}
function tri(x,y,w,h,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-w,y);ctx.lineTo(x,y-h);ctx.lineTo(x+w,y);ctx.fill();}
function drawEnemy(v){
 v.ph=v.ph??Math.random()*6.28;v.vis=v.type==='stealth'?(Math.sin(gameTime/40+v.ph)>0?1:.3):1;ctx.globalAlpha=v.vis;
 const s=v.size*1.05,y=v.y+Math.sin(gameTime/9+v.ph)*2,x=v.x,slow=v.slowTimer>0;
 const col=slow?'#a8e6ff':ECOL[v.type];
 if(v.type==='tank'){ear(x-s*.7,y-s*.85,s*.4,col,-.3);ear(x+s*.7,y-s*.85,s*.4,col,.3);}
 else if(v.type==='normal'||v.type==='split'){tri(x-s*.55,y-s*.55,s*.3,s*.55,col);tri(x+s*.55,y-s*.55,s*.3,s*.55,col);}
 else{tri(x-s*.4,y-s*.7,s*.18,s*.4,'#ff7aa8');tri(x+s*.4,y-s*.7,s*.18,s*.4,'#ff7aa8');}
 blob(x,y,s,col,v.ph);face(x,y,s,v.ph);
 ctx.font=Math.round(s*.9)+'px sans-serif';ctx.textAlign='center';
 ctx.fillText((v.final?'👿':EICON[v.type]),x+s*.95,y-s*.8);
 ctx.fillStyle='#2d3436';ctx.fillRect(x-12,y-s-10,24,4);ctx.fillStyle='#ff7675';ctx.fillRect(x-12,y-s-10,24*Math.max(0,v.hp/v.maxHp),4);ctx.globalAlpha=1;
}

 ctx.fillStyle='#fff';[[-8,2,8],[8,2,8],[0,-4,10],[0,4,10]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(a.x+dx,y+dy,r,0,7);ctx.fill();});

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let screenWidth = window.innerWidth, screenHeight = window.innerHeight, screenShake = 0, gameTime = 0;

let world = {};

const player = { x: screenWidth / 2, y: screenHeight * 0.72, radius: 14, speed: 4.2, carryingCode: 0, maxCapacity: 10, attackRange: 105 };

let coins = 80, castleHeightLevel = 1, osVersion = 1.0, castleHp = 100, castleMaxHp = 100, castleCodeStored = 0, castleCodeTarget = 10;

const keys = {};
let touchStartPos = null, touchCurrentPos = null;

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('touchstart', e => {
    touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    touchCurrentPos = { ...touchStartPos };
}, { passive: true });
window.addEventListener('touchmove', e => {
    if (!touchStartPos) return;
    touchCurrentPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
window.addEventListener('touchend', () => { touchStartPos = null; touchCurrentPos = null; });

function spawnVirus(forceIdx) {
    const timeScale = (1 + Math.min(gameTime / 2400, 2.5)) * wave.mul * stageDiff().m;
    const heightScale = 1 + (castleHeightLevel * 0.08);
    const dm = timeScale * heightScale;
    const mitig = Math.max(0.5, 1.0 - (world.pads.training.level * 0.06));
    const types = [
        { type: 'fast', speed: 1.7 * Math.min(2.0, timeScale), hp: 16 * dm, maxHp: 16 * dm, color: '#ff6b81', size: 11, label: 'チビ' },
        { type: 'normal', speed: 1.1 * Math.min(1.8, timeScale), hp: 38 * dm, maxHp: 38 * dm, color: '#ff4757', size: 15, label: 'ウイルス' },
        { type: 'tank', speed: 0.65 * Math.min(1.5, timeScale), hp: 110 * dm * mitig, maxHp: 110 * dm * mitig, color: '#a55eea', size: 21, label: 'ボス' },
        { type: 'swarm', speed: 1.5 * Math.min(2.0, timeScale), hp: 7 * dm, maxHp: 7 * dm, color: '#ffd6a5', size: 8, label: 'ぷに' },
        { type: 'split', speed: 0.9 * Math.min(1.8, timeScale), hp: 45 * dm, maxHp: 45 * dm, color: '#b8f2c9', size: 16, label: 'もち' },
        { type: 'stealth', speed: 1.2 * Math.min(1.8, timeScale), hp: 30 * dm, maxHp: 30 * dm, color: '#d7d7ff', size: 13, label: 'おばけ' },
        { type: 'healer', speed: 0.8 * Math.min(1.8, timeScale), hp: 55 * dm, maxHp: 55 * dm, color: '#fff0a0', size: 15, label: 'マスター' }
    ];
    const rand = Math.random();
    let chosen = types[1];
    if (rand < 0.45) chosen = types[0];
    else if (rand > (0.82 - Math.min(0.3, gameTime / 8000))) chosen = types[2];
    const th = wave.theme;
    if (th === 'swarm') chosen = rand < 0.8 ? types[3] : types[0];
    else if (th === 'split') chosen = rand < 0.6 ? types[4] : types[1];
    else if (th === 'stealth') chosen = rand < 0.6 ? types[5] : types[0];
    else if (th === 'healer') chosen = rand < 0.25 ? types[6] : (rand < 0.7 ? types[1] : types[0]);
    else if (th === 'heavy') chosen = rand < 0.5 ? types[2] : types[1];
    if (forceIdx !== undefined) chosen = types[forceIdx];
    viruses.push({ x: screenWidth * 0.1 + Math.random() * (screenWidth * 0.8), y: screenHeight + 20, ...chosen, eatTimer: 0, slowTimer: 0 });
}

function addParticles(x, y, color, count = 6) {
    for (let i = 0; i < count; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 1.0, color, size: Math.random() * 4 + 2 });
}
function addDebris(x, y) {
    for (let i = 0; i < 5; i++) castleDebris.push({
        x, y, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.7) * 5, life: 1.0,
        color: ['#ffb7c5', '#ffeaa7', '#74b9ff', '#ffd166', '#a29bfe'][Math.floor(Math.random() * 5)],
        size: Math.random() * 6 + 3
    });
}

function update() {
    gameTime++;
    eventTick();
    const P = world.pads;

    if (gameTime % 60 === 0 && castleHp < castleMaxHp) castleHp = Math.min(castleMaxHp, castleHp + P.osUpdate.level * 0.7);

    let moveX = 0, moveY = 0;
    if (keys['w'] || keys['arrowup']) moveY -= 1;
    if (keys['s'] || keys['arrowdown']) moveY += 1;
    if (keys['a'] || keys['arrowleft']) moveX -= 1;
    if (keys['d'] || keys['arrowright']) moveX += 1;
    if (touchStartPos && touchCurrentPos) {
        const dx = touchCurrentPos.x - touchStartPos.x, dy = touchCurrentPos.y - touchStartPos.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 6) { moveX = dx / dist; moveY = dy / dist; }
    }
    if (moveX !== 0 && moveY !== 0 && !touchStartPos) { moveX *= 0.7071; moveY *= 0.7071; }
    player.x = Math.max(player.radius, Math.min(screenWidth - player.radius, player.x + moveX * player.speed));
    player.y = Math.max(player.radius, Math.min(screenHeight - player.radius, player.y + moveY * player.speed));

    const term = world.devTerminal;
    term.progress += 0.95 * (1 + P.osUpdate.level * 0.05 + P.training.level * 0.08);
    if (term.progress >= 100) {
        term.progress = 0;
        if (player.carryingCode < player.maxCapacity && Math.hypot(player.x - term.x, player.y - term.y) < 90) {
            player.carryingCode++;
            coins += P.training.level * 2;
            playBeep(650, 'triangle', 0.04);
            addParticles(term.x, term.y, '#70a1ff', 3);
        }
    }

    const scpBoost = 1 + P.osUpdate.level * 0.08;
    scpTimer += P.scpSpeed.level * 0.95 * scpBoost;
    if (scpTimer >= 65) { scpTimer = 0; scpPackages.push({ progress: 0 }); }
    for (let i = scpPackages.length - 1; i >= 0; i--) {
        const p = scpPackages[i];
        p.progress += 0.022 * P.scpSpeed.level * scpBoost;
        if (p.progress >= 1.0) {
            scpPackages.splice(i, 1);
            castleCodeStored++;
            coins += Math.floor((5 + P.scpSpeed.level * 4 + P.training.level * 2) * (1 + P.osUpdate.level * 0.1));
            addParticles(world.castle.x, world.castle.y, '#ffbe76', 5);
            playBeep(880, 'sine', 0.05);
        }
    }

    if (Math.hypot(player.x - world.castle.x, player.y - world.castle.y) < 75 && player.carryingCode > 0) {
        castleCodeStored += player.carryingCode;
        coins += Math.floor(player.carryingCode * (9 + P.training.level * 2) * (1 + P.osUpdate.level * 0.1));
        addParticles(world.castle.x, world.castle.y, '#ffeaa7', player.carryingCode * 3);
        player.carryingCode = 0;
        playBeep(1020, 'sine', 0.08);
    }

    if (P.antivirus.level > 0) {
        P.antivirus.pulseTimer++;
        if (P.antivirus.pulseTimer >= Math.max(80, 230 - P.antivirus.level * 25)) {
            P.antivirus.pulseTimer = 0;
            pulseWaves.push({ x: P.antivirus.x, y: P.antivirus.y, r: 10, maxR: Math.max(screenWidth, screenHeight) * 0.85, damage: 25 + P.antivirus.level * 16 });
            playBeep(420, 'square', 0.18);
        }
    }
    for (let i = pulseWaves.length - 1; i >= 0; i--) {
        const pw = pulseWaves[i];
        pw.r += 13;
        viruses.forEach(v => {
            if (Math.abs(Math.hypot(v.x - pw.x, v.y - pw.y) - pw.r) < 22) {
                v.hp -= pw.damage * 0.1; v.slowTimer = 65;
                addParticles(v.x, v.y, '#00cec9', 2);
            }
        });
        if (pw.r >= pw.maxR) pulseWaves.splice(i, 1);
    }

    virusSpawnTimer++;
    if (wave.phase === 'fight' && virusSpawnTimer > Math.max(12, (105 - castleHeightLevel * 3 - Math.min(gameTime / 130, 60)) / (wave.mul * stageDiff().rate))) {
        virusSpawnTimer = 0;
        spawnVirus();
        if (wave.theme === 'swarm') { spawnVirus(); spawnVirus(); }
        if (gameTime > 1500 && Math.random() < 0.35) spawnVirus();
        if (castleHeightLevel > 10 && Math.random() < 0.45) spawnVirus();
    }

    for (let i = viruses.length - 1; i >= 0; i--) {
        const v = viruses[i];
        const hp0 = v.hp;
        if (v.type === 'healer') viruses.forEach(o => { if (o !== v && Math.hypot(o.x - v.x, o.y - v.y) < 90) o.hp = Math.min(o.maxHp, o.hp + 0.25); });
        let targetY = world.castle.y;
        if (v.slowTimer > 0) v.slowTimer--;
        const spd = v.slowTimer > 0 ? v.speed * 0.45 : v.speed;
        const wm = wallEffect(v);
        const ang = Math.atan2(targetY - v.y, world.castle.x - v.x);
        v.x += Math.cos(ang) * spd * wm; v.y += Math.sin(ang) * spd * wm;

        if (Math.hypot(v.x - world.castle.x, v.y - world.castle.y) < 50) {
            v.eatTimer++;
            if (v.eatTimer % 15 === 0) {
                screenShake = 8; addDebris(v.x, v.y); playBeep(140, 'sawtooth', 0.1);
                if (castleCodeStored > 0) castleCodeStored--;
                castleHp -= (v.weak ? 2.5 : 5) * stageDiff().dmg;
                if (castleHp <= 0) {
                    if (castleHeightLevel > stageFloor()) {
                        castleHeightLevel--; castleHp = castleMaxHp; screenShake = 15;
                        addDebris(world.castle.x, world.castle.y); playBeep(100, 'sawtooth', 0.3);
                    } else gameOver();
                }
            }
        }
        if (Math.hypot(v.x - player.x, v.y - player.y) < player.attackRange) {
            v.hp -= P.playerPower.level * (1 + P.osUpdate.level * 0.05);
            addParticles(v.x, v.y, '#ff4757', 2);
        }
        if (P.firewall.level > 0 && Math.hypot(v.x - P.firewall.x, v.y - P.firewall.y) < 135) {
            v.hp -= P.firewall.level * 0.7;
            addParticles(v.x, v.y, '#ff7f50', 1);
        }
        if (v.type === 'stealth' && v.vis < 1 && v.hp < hp0) v.hp = hp0 - (hp0 - v.hp) * 0.3;
        if (v.hp <= 0) {
            addParticles(v.x, v.y, v.color, 12); onKill(v);
            if (v.type === 'split') for (let k = 0; k < 2; k++) viruses.push({ x: v.x + (k ? 10 : -10), y: v.y, type: 'fast', speed: 1.8, hp: 12, maxHp: 12, color: '#ffb3d1', size: 8, eatTimer: 0, slowTimer: 0 });
            coins += v.maxHp > 60 ? 25 : 12;
            viruses.splice(i, 1);
            playBeep(780, 'sine', 0.05);
        }
    }

    aiUnits.forEach(ai => {
        let nearest = null, minDist = 999;
        viruses.forEach(v => { const d = Math.hypot(v.x - ai.x, v.y - ai.y); if (d < minDist) { minDist = d; nearest = v; } });
        if (nearest) {
            const a = Math.atan2(nearest.y - ai.y, nearest.x - ai.x);
            ai.x += Math.cos(a) * 2.4; ai.y += Math.sin(a) * 2.4;
            if (minDist < 100) { nearest.hp -= 0.75 * (1 + P.osUpdate.level * 0.05); addParticles(nearest.x, nearest.y, '#a55eea', 1); }
        } else {
            ai.angle = (ai.angle || 0) + 0.035;
            ai.x = world.castle.x + Math.cos(ai.angle) * 110;
            ai.y = world.castle.y + Math.sin(ai.angle) * 55;
        }
    });

    checkPad(P.castleRepair, () => {
        if (castleCodeStored >= castleCodeTarget && castleHeightLevel < (endless ? 999 : FINAL_LV)) {
            castleCodeStored -= castleCodeTarget;
            castleHeightLevel++; castleMaxHp += 20; castleHp = castleMaxHp; onLevelUp();
            castleCodeTarget = Math.floor(castleCodeTarget * 1.25);
            P.castleRepair.codeRequired = castleCodeTarget;
            addParticles(world.castle.x, world.castle.y, '#ffb7c5', 30);
            playBeep(1200, 'triangle', 0.25);
        } else if (castleHp < castleMaxHp && coins >= 10) {
            coins -= 10; castleHp = Math.min(castleMaxHp, castleHp + 25);
            playBeep(620, 'sine', 0.08);
        }
    });
    checkPad(P.firewall, () => { if (coins >= P.firewall.cost) { coins -= P.firewall.cost; P.firewall.level++; P.firewall.cost = Math.floor(P.firewall.cost * 1.7); playBeep(820, 'square', 0.12); } });
    checkPad(P.aiStaff, () => {
        if (coins >= P.aiStaff.cost) {
            coins -= P.aiStaff.cost; P.aiStaff.count++;
            aiUnits.push({ x: world.castle.x, y: world.castle.y, angle: Math.random() * Math.PI * 2 });
            P.aiStaff.cost = Math.floor(P.aiStaff.cost * 1.8); playBeep(920, 'sine', 0.15);
        }
    });
    checkPad(P.scpSpeed, () => { if (coins >= P.scpSpeed.cost) { coins -= P.scpSpeed.cost; P.scpSpeed.level++; P.scpSpeed.cost = Math.floor(P.scpSpeed.cost * 1.6); playBeep(860, 'triangle', 0.12); } });
    checkPad(P.playerPower, () => { if (coins >= P.playerPower.cost) { coins -= P.playerPower.cost; P.playerPower.level++; P.playerPower.cost = Math.floor(P.playerPower.cost * 1.6); playBeep(1100, 'sine', 0.12); } });
    checkPad(P.antivirus, () => { if (coins >= P.antivirus.cost) { coins -= P.antivirus.cost; P.antivirus.level++; P.antivirus.cost = Math.floor(P.antivirus.cost * 1.7); playBeep(1000, 'square', 0.15); } });
    checkPad(P.osUpdate, () => {
        if (coins >= P.osUpdate.cost) {
            coins -= P.osUpdate.cost; P.osUpdate.level++;
            osVersion = (1.0 + (P.osUpdate.level - 1) * 0.5).toFixed(1);
            castleMaxHp += 20; castleHp += 20;
            P.osUpdate.cost = Math.floor(P.osUpdate.cost * 1.8);
            playBeep(1300, 'triangle', 0.25);
            addParticles(P.osUpdate.x, P.osUpdate.y, '#e84393', 20);
        }
    });
    checkPad(P.training, () => {
        if (coins >= P.training.cost) {
            coins -= P.training.cost; P.training.level++;
            P.training.cost = Math.floor(P.training.cost * 1.65);
            playBeep(1150, 'sine', 0.18);
            addParticles(P.training.x, P.training.y, '#fdcb6e', 20);
        }
    });

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = castleDebris.length - 1; i >= 0; i--) {
        const d = castleDebris[i]; d.x += d.vx; d.y += d.vy; d.vy += 0.3; d.life -= 0.03;
        if (d.life <= 0) castleDebris.splice(i, 1);
    }
    if (screenShake > 0) screenShake *= 0.85;
    applyIncome();

    document.getElementById('coinText').innerText = coins;
    document.getElementById('castleHeightText').innerText = `S${stageOf(castleHeightLevel) + 1}/5 ${STAGE_NAMES[stageOf(castleHeightLevel)]} Lv.${castleHeightLevel}`;
    document.getElementById('trainLvText').innerText = P.training.level;
    document.getElementById('osLvText').innerText = osVersion;
    document.getElementById('codeText').innerText = `${player.carryingCode}/${player.maxCapacity}`;
}

function checkPad(pad, callback) {
    if (Math.hypot(player.x - pad.x, player.y - pad.y) < pad.r) {
        pad.stepTimer = (pad.stepTimer || 0) + 1;
        if (pad.stepTimer > 14) { pad.stepTimer = 0; const c = coins, h = castleHeightLevel; callback(); if (coins < c || castleHeightLevel > h) padTip(pad); }
    } else pad.stepTimer = 0;
}

function draw() {
    ctx.save();
    if (screenShake > 0.5) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 🌺 沖縄ステージ背景(レベルで切り替え)
    drawBackground(ctx, canvas.width, canvas.height, castleHeightLevel, gameTime);

    pulseWaves.forEach(pw => {
        ctx.strokeStyle = 'rgba(0,206,201,0.6)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(pw.x, pw.y, pw.r, 0, Math.PI * 2); ctx.stroke();
    });

    const term = world.devTerminal, castle = world.castle;
    ctx.strokeStyle = '#74b9ff'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(term.x, term.y); ctx.lineTo(term.x, castle.y + 20); ctx.lineTo(castle.x, castle.y + 20); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();

    scpPackages.forEach(p => {
        let px, py;
        if (p.progress < 0.65) { px = term.x; py = term.y - (p.progress / 0.65) * (term.y - (castle.y + 20)); }
        else { px = term.x + ((p.progress - 0.65) / 0.35) * (castle.x - term.x); py = castle.y + 20; }
        ctx.fillStyle = '#ffeaa7'; ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fdcb6e'; ctx.stroke();
    });

    ctx.fillStyle = '#0984e3'; ctx.fillRect(term.x - term.w / 2, term.y - term.h / 2, term.w, term.h);
    ctx.strokeStyle = '#74b9ff'; ctx.lineWidth = 2; ctx.strokeRect(term.x - term.w / 2, term.y - term.h / 2, term.w, term.h);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('💻 開発端末', term.x, term.y - 8);
    ctx.fillStyle = '#2d3436'; ctx.fillRect(term.x - 28, term.y + 8, 56, 7);
    ctx.fillStyle = '#00cec9'; ctx.fillRect(term.x - 28, term.y + 8, 56 * (term.progress / 100), 7);

    const P = world.pads;
    drawPad(P.castleRepair, '#ffb7c5', `🤝信頼 ${castleCodeStored}/${P.castleRepair.codeRequired}`);
    drawPad(P.firewall, '#ff7f50', `FW Lv.${P.firewall.level} (${P.firewall.cost}₡)`);
    drawPad(P.aiStaff, '#a55eea', `AI ${P.aiStaff.count}体 (${P.aiStaff.cost}₡)`);
    drawPad(P.scpSpeed, '#74b9ff', `販売 Lv.${P.scpSpeed.level} (${P.scpSpeed.cost}₡)`);
    drawPad(P.playerPower, '#ffeaa7', `攻撃 Lv.${P.playerPower.level} (${P.playerPower.cost}₡)`);
    drawPad(P.antivirus, '#00cec9', `ワクチン Lv.${P.antivirus.level} (${P.antivirus.cost}₡)`);
    drawPad(P.osUpdate, '#e84393', `OS壁 Lv.${P.osUpdate.level} (${P.osUpdate.cost}₡)`);
    drawPad(P.training, '#fdcb6e', `🎓教育 Lv.${P.training.level} (${P.training.cost}₡)`);

    if (P.training.level > 0) {
        for (let i = 0; i < Math.min(6, P.training.level); i++) {
            const a = (i / 6) * Math.PI * 2 + gameTime * 0.02;
            ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('✏️', P.training.x + Math.cos(a) * 36, P.training.y + Math.sin(a) * 20);
        }
    }

    drawWalls();

    drawInfiniteCastle(castle.x, castle.y, castleHeightLevel);

    drawGifts();
    aiUnits.forEach(drawAlly);
    viruses.forEach(drawEnemy);
    drawPlayer();
    ctx.strokeStyle = 'rgba(255,234,167,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.attackRange, 0, Math.PI * 2); ctx.stroke();

    for (let i = 0; i < player.carryingCode; i++) {
        ctx.fillStyle = '#70a1ff'; ctx.fillRect(player.x - 8, player.y - 22 - i * 8, 16, 6);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(player.x - 8, player.y - 22 - i * 8, 16, 6);
    }

    particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fillRect(p.x, p.y, p.size, p.size); });
    castleDebris.forEach(d => { ctx.fillStyle = d.color; ctx.globalAlpha = d.life; ctx.fillRect(d.x, d.y, d.size, d.size); });
    ctx.globalAlpha = 1.0;

    if (touchStartPos && touchCurrentPos) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(touchStartPos.x, touchStartPos.y, 35, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,158,187,0.65)';
        ctx.beginPath(); ctx.arc(touchCurrentPos.x, touchCurrentPos.y, 16, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function drawInfiniteCastle(x, y, heightLv) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#ffb7c5'; ctx.fillRect(-45, -10, 90, 30);
    const numTiers = Math.min(12, heightLv);
    const tierColors = ['#ffeaa7', '#74b9ff', '#ff9ff3', '#feca57', '#55efc4', '#a29bfe'];
    for (let i = 0; i < numTiers; i++) {
        const hOffset = -10 - i * 18, width = Math.max(30, 80 - i * 4);
        ctx.fillStyle = tierColors[i % tierColors.length]; ctx.fillRect(-width / 2, hOffset - 18, width, 18);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(-width / 2, hOffset - 18, width, 18);
    }
    const topH = -10 - numTiers * 18;
    ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.moveTo(-25, topH); ctx.lineTo(0, topH - 25); ctx.lineTo(25, topH); ctx.closePath(); ctx.fill();
    if (heightLv >= 5) { ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('👑', 0, topH - 30); }
    ctx.fillStyle = '#6c5ce7'; ctx.fillRect(-10, 5, 20, 15);
    ctx.fillStyle = '#2d3436'; ctx.fillRect(-40, 25, 80, 7);
    ctx.fillStyle = '#55efc4'; ctx.fillRect(-40, 25, 80 * (castleHp / castleMaxHp), 7);
    ctx.restore();
}

function drawPad(pad, color, label) {
    ctx.save();
    ctx.fillStyle = color; ctx.globalAlpha = 0.22;
    ctx.beginPath(); ctx.arc(pad.x, pad.y, pad.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.85; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    if (pad.stepTimer > 0) {
        ctx.beginPath(); ctx.arc(pad.x, pad.y, pad.r, 0, Math.PI * 2 * (pad.stepTimer / 14));
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.stroke();
    }
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, pad.x, pad.y + 3);
    ctx.restore();
}

window.onload = function() {
    resizeCanvas(); loadGame();
    (function gameLoop() { if (!paused) update(); draw(); requestAnimationFrame(gameLoop); })();
};
</script>
</body>
